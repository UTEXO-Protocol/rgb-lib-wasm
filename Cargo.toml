[package]
name = "rgb-lib-wasm"
version = "1.0.0-beta.4"
authors = [
    "Zoe Faltibà <zoefaltiba@gmail.com>",
    "Nicola Busanello <nicola.busanello@gmail.com>",
]
edition = "2024"
rust-version = "1.88.0"
repository = "https://github.com/RGB-Tools/rgb-lib"
homepage = "https://github.com/RGB-Tools/rgb-lib"
license = "MIT"
description = "RGB wallet library (WASM-only)"

[workspace]
members = [".", "bindings/wasm"]

[dependencies]
base64 = { version = "0.23.1", default-features = false, features = [
    "std",
] }
bdk_wallet = { version = "=3.2.0", default-features = false, features = [
    "keys-bip39",
    "std",
] }
bdk_core = { version = "0.6" }
bdk_esplora = { version = "0.22.3", optional = true, default-features = false, features = [
    "async-https",
] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = [
    "alloc",
] }
ed25519-dalek = { version = "3", default-features = false }
hkdf = { version = "0.13", default-features = false }
hmac = { version = "0.13", default-features = false }
prost = { version = "0.11.6", default-features = false, features = ["prost-derive"] }
sha2 = { version = "0.11", default-features = false }
x25519-dalek = { version = "3", default-features = false, features = [
    "static_secrets",
] }
tokio = { version = "1", default-features = false, features = ["rt", "sync"] }
esplora-client = { version = "0.12", default-features = false, features = [
    "async-https",
] }
getrandom = { version = "0.2", features = ["js"] }
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
hex = { version = "0.4.3", default-features = false, features = ["alloc"] }
idb = "0.6"
instant = { version = "0.1", features = ["wasm-bindgen"] }
js-sys = "0.3"
rand = { version = "0.10.3", default-features = false, features = ["sys_rng"] }
reqwest = { version = "0.13", optional = true, default-features = false, features = [
    "json",
    "multipart",
] }
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"] }
scrypt = { version = "0.12.0", default-features = false, features = ["phc"] }
serde = { version = "^1.0", default-features = false, features = [
    "derive",
] }
serde_json = { version = "^1.0", default-features = false, features = [
    "preserve_order",
] }
slog = { version = "2.8.2", default-features = false }
thiserror = { version = "2.0", default-features = false }
time = { version = "0.3.55", default-features = false, features = ["macros", "formatting", "wasm-bindgen"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "FormData",
    "Blob",
    "BlobPropertyBag",
    "console",
    "IdbDatabase",
    "IdbTransaction",
    "MessageChannel",
    "MessagePort",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "RequestRedirect",
    "StorageManager",
] }
zeroize = { version = "1.9", features = ["serde"] }

# RGB-related deps
amplify = { version = "=4.8.1", default-features = false }
rgb-invoicing = { version = "=0.11.2-rc.1", default-features = false }
rgb-psbt-utils = { version = "=0.11.2-rc.1", default-features = false }
rgb-schemas = { version = "=0.11.2-rc.1", default-features = false }
rgb-ops = { version = "=0.11.2-rc.1", default-features = false, features = [
    "serde",
] }
rgb-strict-encoding = { version = "=1.0.5", default-features = false, features = [
    "bitcoin",
] }
rgb-strict-types = { version = "=1.0.5", default-features = false }

[features]
default = ["esplora"]
esplora = [
    "bdk_esplora",
    "reqwest",
]
camel_case = []

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
mockito = { version = "1", default-features = false }

[profile.reldebug]
inherits = "release"
debug = 1

[patch.crates-io]
rgb-aluvm = { git = "https://github.com/rgb-protocol/rgb-aluvm", rev = "eb956ccaadf64930990e2ed08f6c4232caee24f9" }
rgb-ascii-armor = { git = "https://github.com/rgb-protocol/rgb-ascii-armor", rev = "40cdea632fd6d0527494893e83b99cea60ace310" }
rgb-consensus = { git = "https://github.com/rgb-protocol/rgb-consensus", rev = "d4bbbce212e4d9967e10cc3c6a7db2f664d52bd2" }
rgb-invoicing = { git = "https://github.com/rgb-protocol/rgb-ops", rev = "00f8d62e6107767cca085d9f9b3183c35ad6d71f" }
rgb-ops = { git = "https://github.com/rgb-protocol/rgb-ops", rev = "00f8d62e6107767cca085d9f9b3183c35ad6d71f" }
rgb-psbt-utils = { git = "https://github.com/rgb-protocol/rgb-api", rev = "4922e50734ab456d086546ab2befd5fa0aec99cc" }
rgb-schemas = { git = "https://github.com/rgb-protocol/rgb-schemas", rev = "b3f88f28c83aa8c73cf9ed2bb40ad6890142d675" }
rgb-strict-encoding = { git = "https://github.com/rgb-protocol/rgb-strict-encoding", rev = "e12b9944b30171950de03778d6666b24bc33d994" }
rgb-strict-encoding-derive = { git = "https://github.com/rgb-protocol/rgb-strict-encoding", rev = "e12b9944b30171950de03778d6666b24bc33d994" }
rgb-strict-types = { git = "https://github.com/rgb-protocol/rgb-strict-types", rev = "8714cdcc8af25333c27214cdf9f42a6388d484ff" }
