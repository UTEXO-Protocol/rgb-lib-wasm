name: CI

on:
  push:
    branches: [dev, stage, master]
  pull_request:
    branches: [dev, stage, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --target wasm32-unknown-unknown -- -D warnings

  check:
    name: WASM check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --target wasm32-unknown-unknown

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --target wasm32-unknown-unknown

  native-tests:
    name: Native tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --lib

  wasm-tests:
    name: WASM tests (Firefox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: cargo install wasm-pack@0.14.0
      - name: Run key tests
        run: wasm-pack test --headless --firefox --release -- --test keys_wasm
      - name: Run proof of work tests
        env:
          WASM_BINDGEN_TEST_TIMEOUT: 300
        run: wasm-pack test --headless --firefox --release -- --test pow_wasm
      - name: Run overflow check tests
        run: wasm-pack test --headless --firefox --release -- --test overflow_checks_wasm
      - name: Run indexer registry tests
        run: 'wasm-pack test --headless --firefox --release --lib -- no_store_fetch_browser'

  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # Only a pull request can skip the regtest jobs
      - id: filter
        name: Detect code changes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ] && FILES=$(git diff --no-renames --name-only HEAD^1 HEAD) && [ -n "$FILES" ] \
            && ! echo "$FILES" | grep -q -v -E '\.md$|^LICENSE$'; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  integration-tests:
    name: Integration tests (Firefox + regtest, ${{ matrix.group }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [receive-check, send, mint, lib, wallet]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ matrix.group == 'wallet' }}
      - name: Install wasm-pack
        run: cargo install wasm-pack@0.14.0

      - name: Cache regtest images
        id: regtest-images
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/regtest-images.tar
          key: regtest-images-${{ runner.os }}-${{ hashFiles('tests/docker-compose.ci.yml', 'tests/esplora/**', 'tests/regtest-helper/**', 'tests/vss-server/**') }}

      - name: Load regtest images
        if: steps.regtest-images.outputs.cache-hit == 'true'
        run: docker load -i "$RUNNER_TEMP/regtest-images.tar"

      - name: Start regtest services
        working-directory: tests
        run: |
          docker compose -f docker-compose.ci.yml up -d
          echo "Waiting for regtest-helper..."
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/status > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          echo "Waiting for esplora..."
          for i in $(seq 1 120); do
            if docker compose -f docker-compose.ci.yml logs esplora 2>&1 | grep -q 'run: nginx:'; then
              break
            fi
            if [ $i -eq 120 ]; then
              echo "Timeout waiting for esplora"
              docker compose -f docker-compose.ci.yml logs esplora
              exit 1
            fi
            sleep 1
          done

          echo "Connecting bitcoind peers..."
          docker compose -f docker-compose.ci.yml exec -T bitcoind \
            bitcoin-cli -regtest -rpcuser=user -rpcpassword=default_password \
            addnode "esplora:18444" "add" || true
          docker compose -f docker-compose.ci.yml exec -T esplora \
            cli addnode "bitcoind:18444" "add" || true
          sleep 2

          echo "Mining initial blocks..."
          curl -s -X POST http://127.0.0.1:8080/mine \
            -H 'Content-Type: application/json' \
            -d '{"blocks": 111}'

          echo "Waiting for esplora to sync..."
          for i in $(seq 1 120); do
            HEIGHT=$(curl -sf http://127.0.0.1:8094/regtest/api/blocks/tip/height 2>/dev/null || echo "0")
            if [ "$HEIGHT" -ge 111 ] 2>/dev/null; then
              break
            fi
            sleep 1
          done
          echo "Regtest ready at height $HEIGHT"

          echo "Waiting for VSS server (via CORS proxy)..."
          for i in $(seq 1 120); do
            if curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8082/vss/getObject 2>/dev/null | grep -q "400\|401\|405\|200"; then
              echo "VSS server ready"
              break
            fi
            if [ $i -eq 120 ]; then
              echo "Timeout waiting for VSS server"
              docker compose -f docker-compose.ci.yml logs vss-server
              docker compose -f docker-compose.ci.yml logs vss-cors-proxy
              exit 1
            fi
            sleep 1
          done

      - name: Export regtest images
        if: steps.regtest-images.outputs.cache-hit != 'true' && matrix.group == 'wallet'
        run: docker save -o "$RUNNER_TEMP/regtest-images.tar" tests-esplora tests-regtest-helper tests-vss-server

      - name: Run wallet tests
        if: matrix.group == 'wallet'
        env:
          WASM_BINDGEN_TEST_TIMEOUT: 300
        run: wasm-pack test --headless --firefox --release -- --test wallet_wasm

      - name: Run binding tests
        if: matrix.group == 'wallet'
        env:
          WASM_BINDGEN_TEST_TIMEOUT: 300
        run: wasm-pack test --headless --firefox --release bindings/wasm --test bindings_wasm

      - name: Run integration tests
        if: matrix.group == 'wallet'
        env:
          WASM_BINDGEN_TEST_TIMEOUT: 300
        run: wasm-pack test --headless --firefox --release --test integration_wasm

      - name: Run receive tests
        if: matrix.group == 'send'
        env:
          WASM_BINDGEN_TEST_TIMEOUT: 600
        run: wasm-pack test --headless --firefox --release --test receive_wasm

      - name: Run persistence tests
        if: matrix.group == 'wallet'
        env:
          WASM_BINDGEN_TEST_TIMEOUT: 1800
        run: wasm-pack test --headless --firefox --release --test persistence_wasm

      - name: Run send tests
        if: matrix.group == 'send'
        env:
          WASM_BINDGEN_TEST_TIMEOUT: 3600
        run: wasm-pack test --headless --firefox --release --test send_wasm

      # The BFA lib browser tests run one test file per Firefox session, so a session holds
      # only a part of the suite in memory
      - name: Run BFA tests
        if: matrix.group == 'mint'
        env:
          WASM_BINDGEN_TEST_TIMEOUT: 1800
        run: 'wasm-pack test --headless --firefox --release --lib -- test_bfa::'

      - name: Run BFA burn tests
        if: matrix.group == 'lib'
        env:
          WASM_BINDGEN_TEST_TIMEOUT: 1800
        run: 'wasm-pack test --headless --firefox --release --lib -- test_burn::'

      - name: Run BFA mint tests
        if: matrix.group == 'mint'
        env:
          WASM_BINDGEN_TEST_TIMEOUT: 3600
        run: 'wasm-pack test --headless --firefox --release --lib -- test_mint::'

      - name: Run receive check tests
        if: matrix.group == 'receive-check'
        env:
          WASM_BINDGEN_TEST_TIMEOUT: 1800
        run: 'wasm-pack test --headless --firefox --release --lib -- test_send::'
      - name: Run import tests
        if: matrix.group == 'lib'
        env:
          WASM_BINDGEN_TEST_TIMEOUT: 1800
        run: 'wasm-pack test --headless --firefox --release --lib -- test_import::'
      - name: Run link tests
        if: matrix.group == 'lib'
        env:
          WASM_BINDGEN_TEST_TIMEOUT: 1800
        run: 'wasm-pack test --headless --firefox --release --lib -- test_link::'
      - name: Run vanilla tests
        if: matrix.group == 'lib'
        env:
          WASM_BINDGEN_TEST_TIMEOUT: 1800
        run: 'wasm-pack test --headless --firefox --release --lib -- test_vanilla::'

      - name: Stop regtest services
        if: always()
        working-directory: tests
        run: docker compose -f docker-compose.ci.yml down

  integration-tests-result:
    name: Integration tests (Firefox + regtest)
    needs: [changes, integration-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check integration tests
        run: test "${{ needs.integration-tests.result }}" = success || test "${{ needs.integration-tests.result }}:${{ needs.changes.outputs.code }}" = skipped:false
